<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2efe7" />
    <meta name="description" content="A calming generative gear machine and counting game." />
    <title>Shifting Gears</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main id="app" class="app" data-screen="opening">
      <canvas
        id="gear-canvas"
        aria-label="A mechanical composition that grows one gear at a time."
        role="img"
      ></canvas>

      <div class="wash" aria-hidden="true"></div>

      <section class="opening" id="opening" aria-labelledby="opening-title">
        <div class="opening-copy">
          <p class="maker-mark">A kinetic counting game</p>
          <h1 id="opening-title">Shifting<br />Gears</h1>
          <p class="opening-line">Watch the machine build itself.</p>
          <fieldset class="pace-picker">
            <legend>Game speed</legend>
            <div class="pace-options">
              <button type="button" data-game-pace="regular" aria-pressed="true">
                <span>Regular</span>
                <small>Builds up quickly</small>
              </button>
              <button type="button" data-game-pace="fast" aria-pressed="false">
                <span>Faster</span>
                <small>Gets crowded fast</small>
              </button>
            </div>
          </fieldset>
          <div class="opening-actions">
            <button class="button button-primary" id="game-start">Game Mode</button>
            <button class="button button-secondary" id="zen-start">Zen Mode</button>
          </div>
        </div>
      </section>

      <header class="topbar" id="topbar" aria-label="Experience controls">
        <button class="wordmark" id="home-button" aria-label="Return to the opening screen">
          <span>Shifting</span><span>Gears</span>
        </button>
        <div class="mode-label" id="mode-label" aria-live="polite"></div>
      </header>

      <section class="game-controls" id="game-controls" aria-label="Game controls">
        <button class="stop-button" id="stop-button">
          <span>Stop</span>
          <small>when you are ready</small>
        </button>
      </section>

      <section class="game-dock guess-dock" id="guess-panel" aria-labelledby="guess-title" aria-hidden="true">
        <form id="guess-form" class="dock-inner">
          <div class="dock-question">
            <p class="panel-kicker">The machine is still</p>
            <h2 id="guess-title">How many gears are there?</h2>
          </div>
          <label class="sr-only" for="guess-input">Your guess</label>
          <div class="guess-row">
            <input id="guess-input" name="guess" type="number" min="1" max="999" inputmode="numeric" autocomplete="off" required aria-label="Your guess" />
            <button class="button button-primary" type="submit">Guess</button>
          </div>
        </form>
      </section>

      <section class="game-dock result-dock" id="result-panel" aria-labelledby="result-title" aria-hidden="true">
        <div class="dock-inner result-inner">
          <div class="result-answer">
            <p class="actual-count"><span id="actual-count">0</span> <span>gears</span></p>
            <div>
              <h2 id="result-title" tabindex="-1">Exactly right.</h2>
              <p class="result-detail" id="result-detail"></p>
            </div>
          </div>
          <dl class="stats" aria-label="Session statistics">
            <div><dt>Closest</dt><dd id="closest-stat">-</dd></div>
            <div><dt>Exact</dt><dd id="exact-stat">0</dd></div>
          </dl>
          <div class="result-actions">
            <button class="button button-secondary count-button" id="count-button" aria-pressed="false">Show the count</button>
            <button class="button button-primary" id="again-button">Again</button>
          </div>
        </div>
      </section>

      <nav class="zen-controls" id="zen-controls" aria-label="Zen mode controls">
        <button class="quiet-button" id="pause-button">Pause</button>
        <button class="quiet-button" id="customize-button" aria-controls="customize-drawer" aria-expanded="false">Customize</button>
        <button class="quiet-button" id="reset-button">Reset</button>
        <button class="quiet-button sound-button" id="sound-button" aria-pressed="false">Sound off</button>
      </nav>

      <div class="drawer-scrim" id="drawer-scrim" aria-hidden="true"></div>
      <aside class="drawer" id="customize-drawer" aria-labelledby="drawer-title" aria-hidden="true">
        <div class="drawer-header">
          <div>
            <p class="panel-kicker">Tune the machine</p>
            <h2 id="drawer-title">Customize</h2>
          </div>
          <button class="close-button" id="close-drawer" aria-label="Close customize panel">Close</button>
        </div>

        <fieldset>
          <legend>Palette</legend>
          <div class="option-grid palette-options" data-setting="palette">
            <button type="button" data-value="mixed" aria-pressed="true"><span class="swatch" aria-hidden="true"></span>Mixed</button>
            <button type="button" data-value="warm" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>Warm</button>
            <button type="button" data-value="cool" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>Cool</button>
            <button type="button" data-value="muted" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>Muted</button>
            <button type="button" data-value="bright" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>Bright</button>
            <button type="button" data-value="pastel" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>Pastel</button>
            <button type="button" data-value="earthy" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>Earthy</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Speed</legend>
          <div class="option-grid four-options" data-setting="speed">
            <button type="button" data-value="very-slow" aria-pressed="false">Very slow</button>
            <button type="button" data-value="slow" aria-pressed="true">Slow</button>
            <button type="button" data-value="medium" aria-pressed="false">Medium</button>
            <button type="button" data-value="lively" aria-pressed="false">Lively</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Density</legend>
          <div class="option-grid" data-setting="density">
            <button type="button" data-value="sparse" aria-pressed="false">Sparse</button>
            <button type="button" data-value="balanced" aria-pressed="true">Balanced</button>
            <button type="button" data-value="dense" aria-pressed="false">Dense</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Growth direction</legend>
          <div class="option-grid direction-options" data-setting="direction">
            <button type="button" data-value="center" aria-pressed="false">Center out</button>
            <button type="button" data-value="upward" aria-pressed="false">Upward</button>
            <button type="button" data-value="downward" aria-pressed="false">Downward</button>
            <button type="button" data-value="sideways" aria-pressed="false">Sideways</button>
            <button type="button" data-value="organic" aria-pressed="true">Organic</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Gear variety</legend>
          <div class="option-grid" data-setting="variety">
            <button type="button" data-value="simple" aria-pressed="false">Simple</button>
            <button type="button" data-value="mixed" aria-pressed="true">Mixed</button>
            <button type="button" data-value="wild" aria-pressed="false">Wild</button>
          </div>
        </fieldset>
      </aside>

      <p class="sr-only" id="live-result" aria-live="assertive"></p>
    </main>
  </body>
</html>
