<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2efe7" />
    <meta name="description" content="A calming generative gear machine and counting game." />
    <title>Shifting Gears</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260917-1" />
    <script type="module" src="app.js?v=20260917-1"></script>
  </head>
  <body>
    <main id="app" class="app" data-screen="opening">
      <canvas
        id="gear-canvas"
        aria-label="A mechanical composition that grows one gear at a time."
        role="img"
      ></canvas>

      <div class="wash" aria-hidden="true"></div>

      <section class="opening" id="opening" aria-labelledby="opening-title">
        <div class="opening-copy">
          <p class="maker-mark">A kinetic counting game</p>
          <h1 id="opening-title">Shifting<br />Gears</h1>
          <p class="opening-line">Watch the machine build itself.</p>
          <div class="opening-actions">
            <button class="button button-primary" id="game-start">Game Mode</button>
            <button class="button button-secondary" id="zen-start">Zen Mode</button>
          </div>
        </div>
      </section>

      <section class="game-setup" id="game-setup" aria-labelledby="game-setup-title" aria-hidden="true">
        <div class="game-setup-card">
          <p class="panel-kicker">Game Mode</p>
          <h2 id="game-setup-title">How fast should it build?</h2>
          <p class="setup-copy">The machine gets harder to count the longer you let it run.</p>
          <fieldset class="pace-picker">
            <legend>Choose a speed</legend>
            <div class="pace-options">
              <button type="button" data-game-pace="slow" aria-pressed="false">
                <span>Slow</span>
                <small>Take in every turn</small>
              </button>
              <button type="button" data-game-pace="medium" aria-pressed="true">
                <span>Medium</span>
                <small>A balanced challenge</small>
              </button>
              <button type="button" data-game-pace="fast" aria-pressed="false">
                <span>Fast</span>
                <small>Dense in seconds</small>
              </button>
            </div>
          </fieldset>
          <button class="button button-primary setup-start" id="game-confirm">Start the machine</button>
        </div>
      </section>

      <header class="topbar" id="topbar" aria-label="Experience controls">
        <button class="wordmark" id="home-button" aria-label="Return to the opening screen">
          <span>Shifting</span><span>Gears</span>
        </button>
        <div class="mode-label" id="mode-label" aria-live="polite"></div>
      </header>

      <section class="game-controls" id="game-controls" aria-label="Game controls">
        <button class="stop-button" id="stop-button">
          <span>Stop</span>
          <small>when you are ready</small>
        </button>
      </section>

      <section class="game-dock guess-dock" id="guess-panel" aria-labelledby="guess-title" aria-hidden="true">
        <form id="guess-form" class="dock-inner">
          <div class="dock-question">
            <p class="panel-kicker">The machine is still</p>
            <h2 id="guess-title">How many gears are there?</h2>
          </div>
          <label class="sr-only" for="guess-input">Your guess</label>
          <div class="guess-row">
            <input id="guess-input" name="guess" type="number" min="1" max="999" inputmode="numeric" autocomplete="off" required aria-label="Your guess" />
            <button class="button button-primary" type="submit">Guess</button>
          </div>
        </form>
      </section>

      <section class="game-dock result-dock" id="result-panel" aria-labelledby="result-title" aria-hidden="true">
        <div class="dock-inner result-inner">
          <div class="result-answer">
            <p class="actual-count"><span id="actual-count">0</span> <span>gears</span></p>
            <div>
              <h2 id="result-title" tabindex="-1">Exactly right.</h2>
              <p class="result-detail" id="result-detail"></p>
            </div>
          </div>
          <dl class="stats" aria-label="Session statistics">
            <div><dt>Closest</dt><dd id="closest-stat">-</dd></div>
            <div><dt>Exact</dt><dd id="exact-stat">0</dd></div>
          </dl>
          <div class="result-actions">
            <button class="button button-secondary count-button" id="count-button" aria-pressed="false">Show the count</button>
            <button class="button button-primary" id="again-button">Again</button>
          </div>
        </div>
      </section>

      <section class="zen-studio" id="zen-studio" aria-label="Zen mode controls and customization">
        <nav class="zen-actions" aria-label="Playback controls">
          <button class="quiet-button" id="pause-button">Pause</button>
          <button class="quiet-button" id="reset-button">Reset</button>
          <button class="quiet-button sound-button" id="sound-button" aria-pressed="false">Sound off</button>
        </nav>
        <div class="zen-tuners" aria-label="Customize the machine">
          <label>Palette
            <select data-setting="palette">
              <option value="mixed">Mixed</option><option value="warm">Warm</option><option value="cool">Cool</option><option value="muted">Muted</option><option value="bright">Bright</option><option value="pastel">Pastel</option><option value="earthy">Earthy</option>
            </select>
          </label>
          <label>Speed
            <select data-setting="speed">
              <option value="very-slow">Very slow</option><option value="slow" selected>Slow</option><option value="medium">Medium</option><option value="lively">Lively</option>
            </select>
          </label>
          <label>Density
            <select data-setting="density">
              <option value="sparse">Sparse</option><option value="balanced" selected>Balanced</option><option value="dense">Dense</option>
            </select>
          </label>
          <label>Direction
            <select data-setting="direction">
              <option value="center">Center out</option><option value="upward">Upward</option><option value="downward">Downward</option><option value="sideways">Sideways</option><option value="organic" selected>Organic</option>
            </select>
          </label>
          <label>Variety
            <select data-setting="variety">
              <option value="simple">Simple</option><option value="mixed" selected>Mixed</option><option value="wild">Wild</option>
            </select>
          </label>
        </div>
      </section>

      <p class="sr-only" id="live-result" aria-live="assertive"></p>
    </main>
  </body>
</html>
